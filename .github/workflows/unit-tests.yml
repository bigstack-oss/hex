name: Unit Tests

# The shell tests under scripts/tests: self-contained, no build tree, no jail, seconds each.
# Among them test_projsign.sh, the only thing that exercises sums/sign/attest/verify before a
# release's publish job does.
on:
  pull_request:
    paths:
      - "make/**"
      - "scripts/**"
      - ".github/workflows/unit-tests.yml"
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The cosign test_projsign.sh needs is the one the build pins, read from projsign.mk so
      # there is one place to bump it.
      - id: cosign
        run: echo "ver=$(sed -n 's/^COSIGN_VER *:= *//p' make/projsign.mk)" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v${{ steps.cosign.outputs.ver }}

      - name: scripts/tests
        run: |
          rc=0
          for t in scripts/tests/test_*.sh ; do
            echo "::group::$t"
            bash "$t" || { echo "::error file=$t::$t failed" ; rc=1 ; }
            echo "::endgroup::"
          done
          exit $rc
